<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e8b81" />

    <!-- Apply the saved/system theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("casaclean:theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          var resolved = stored === "dark" || stored === "light" ? stored : system;
          if (resolved === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>

    <!-- Fonts are self-hosted (see src/styles/globals.css), so there is no
         third-party stylesheet to block the first paint. Marketing imagery does
         still come from Unsplash — warm that connection while the JS parses. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <title>CasaClean — Premium Turnover Cleaning for Vacation Rentals</title>
    <meta
      name="description"
      content="CasaClean delivers guest-ready turnovers for Airbnb hosts, vacation rental owners and property managers — cleaning, inspections, linens and restocking, on schedule, every time."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
